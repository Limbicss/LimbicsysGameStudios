# Project-scoped Codex config for the studio port (loaded only when the project .codex/ layer is trusted).
# Docs: https://learn.chatgpt.com/docs/config-file/config-reference
# Only low-risk, documented keys are active here. The optional .env read-deny permission profile
# lives in port/codex/permissions.optional.toml (see port/MAPPING.md) because it could not be tested
# without a Codex binary in the build environment.

# AGENTS.md + routing table is ~15 KB; keep headroom above the 32 KiB default.
project_doc_max_bytes = 65536

[agents]
max_concurrent_threads_per_session = 4
